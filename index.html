<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financiero - Top Realtors</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1a2f4a 100%);
      color: rgba(255, 255, 255, 0.9);
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 200px;
      background: rgba(0, 0, 0, 0.3);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 12px 0;
      font-weight: 600;
    }

    .sidebar-item {
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 4px;
      transition: all 0.2s;
      color: rgba(255, 255, 255, 0.6);
    }

    .sidebar-item:hover {
      background: rgba(37, 99, 235, 0.2);
      color: rgba(255, 255, 255, 0.9);
    }

    .sidebar-item.active {
      background: #2563EB;
      color: white;
      font-weight: 500;
    }

    .main {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .header-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
    }

    .month-selector {
      position: relative;
    }

    .month-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }

    .month-btn:hover {
      background: rgba(37, 99, 235, 0.2);
      border-color: #2563EB;
    }

    .month-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      min-width: 200px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 8px;
      z-index: 1000;
      display: none;
    }

    .month-dropdown.active {
      display: block;
    }

    .month-option {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
      font-size: 12px;
    }

    .month-option:hover {
      background: rgba(37, 99, 235, 0.2);
    }

    .month-separator {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 8px 0;
    }

    .month-label {
      padding: 8px 16px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .metric-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 600;
      color: #00E396;
      margin-bottom: 8px;
    }

    .metric-change {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .chart-title {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    .loading-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-title">Panel</div>
    <div class="sidebar-item active">Dashboard</div>
    
    <div class="sidebar-title">Registros</div>
    <div class="sidebar-item">Ventas / Ingresos</div>
    <div class="sidebar-item">Gastos</div>
    <div class="sidebar-item">Cuotas</div>
    
    <div class="sidebar-title">Gestión</div>
    <div class="sidebar-item">Tesorería</div>
    <div class="sidebar-item">Suscripciones</div>
    <div class="sidebar-item">Equipo</div>
  </div>

  <div class="main">
    <div class="header">
      <div>
        <h1>Dashboard</h1>
        <div class="header-subtitle">Mayo 2026</div>
      </div>
      <div class="month-selector">
        <button class="month-btn" id="month-selector-btn">
          Mayo 2026 ▼
        </button>
        <div class="month-dropdown" id="month-dropdown"></div>
      </div>
    </div>

    <div class="metrics" id="metrics-container"></div>

    <div class="chart-container">
      <div class="chart-title">Cash Collected</div>
      <div id="chart-timeline-container"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxI_d6SGxrgXVVvD8H4nmH81TYOBdomysAvDuaCoo-EdEjoR67AORuU8eh5btBg-Bx_3g/userclient';
    let TOKEN = localStorage.getItem('token') || '';
    let CACHE = { ingresos: [], gastos: [], equipo: [] };

    function fmt(n) {
      if (typeof n !== 'number') return '$0';
      if (n >= 1000000) return '$' + (n / 1000000).toFixed(2) + 'M';
      if (n >= 1000) return '$' + (n / 1000).toFixed(1) + 'k';
      return '$' + n.toFixed(0);
    }

    function showLoadingToast() {
      var t = document.getElementById('loading-toast');
      if(t) t.remove();
      t = document.createElement('div');
      t.id = 'loading-toast';
      t.className = 'loading-toast';
      t.innerHTML = '<div class="spinner"></div>Guardando...';
      document.body.appendChild(t);
    }

    function hideLoadingToast() {
      var t = document.getElementById('loading-toast');
      if(t) setTimeout(function() { t.remove(); }, 300);
    }

    async function api(data) {
      showLoadingToast();
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({...data, token: TOKEN})
        });
        const result = await response.json();
        hideLoadingToast();
        return result;
      } catch(e) {
        hideLoadingToast();
        console.error('API Error:', e);
        throw e;
      }
    }

    async function loadDashboard() {
      try {
        const result = await api({ action: 'getDashboardAll' });
        if (result.ok) {
          CACHE = result.data;
          renderMetrics();
          renderChart();
          renderMonthDropdown();
        }
      } catch(e) {
        console.error('Error loading dashboard:', e);
      }
    }

    function renderMetrics() {
      const container = document.getElementById('metrics-container');
      if (!container) return;

      const ingresos = CACHE.ingresos || [];
      const gastos = CACHE.gastos || [];

      const totalIngresos = ingresos.reduce((s, x) => s + (parseFloat(x.monto) || 0), 0);
      const totalGastos = gastos.reduce((s, x) => s + (parseFloat(x.monto) || 0), 0);
      const revenue = totalIngresos - totalGastos;
      const roas = totalGastos > 0 ? (totalIngresos / totalGastos).toFixed(2) : 0;

      container.innerHTML = `
        <div class="metric-card">
          <div class="metric-label">Ingresos</div>
          <div class="metric-value">${fmt(totalIngresos)}</div>
          <div class="metric-change">Total del período</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Gastos</div>
          <div class="metric-value" style="color: #FF4560">${fmt(totalGastos)}</div>
          <div class="metric-change">Total del período</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Revenue Neto</div>
          <div class="metric-value" style="color: #00E396">${fmt(revenue)}</div>
          <div class="metric-change">Ingresos - Gastos</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">ROAS</div>
          <div class="metric-value" style="color: #2563EB">${roas}x</div>
          <div class="metric-change">Ingresos / gastos totales</div>
        </div>
      `;
    }

    function renderChart() {
      const c = document.getElementById('chart-timeline-container');
      if(!c) return;

      const now = new Date();
      const m = now.getMonth(), y = now.getFullYear();
      const pm = m === 0 ? 11 : m - 1, py = m === 0 ? y - 1 : y;

      const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

      const ingresos = CACHE.ingresos || [];
      let i1 = {}, i2 = {};

      ingresos.forEach(function(x) {
        const d = new Date(x.fecha);
        if(d.getMonth() === m && d.getFullYear() === y) {
          const day = d.getDate();
          i1[day] = (i1[day] || 0) + parseFloat(x.monto || 0);
        }
        if(d.getMonth() === pm && d.getFullYear() === py) {
          const day = d.getDate();
          i2[day] = (i2[day] || 0) + parseFloat(x.monto || 0);
        }
      });

      let a1 = 0, a2 = 0, d1 = [], d2 = [];
      for(let i = 1; i <= 31; i++) {
        a1 += i1[i] || 0;
        a2 += i2[i] || 0;
        d1.push(a1);
        d2.push(a2);
      }

      const t1 = a1, t2 = a2, p = t2 > 0 ? ((t1 - t2) / t2 * 100) : 0;

      let html = '<div style="padding:16px">';

      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,0.1)">';
      html += '<div>';
      html += '<div style="font-size:11px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:1px">DASHBOARD FINANCIERO</div>';
      html += '<div style="font-size:18px;font-weight:bold;color:white;margin-top:6px">Cash Collected · ' + months[m] + ' 2026</div>';
      html += '<div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:6px">Acumulado</div>';
      html += '</div>';
      html += '<div style="text-align:right">';
      html += '<div style="font-size:28px;color:#00E396;font-weight:bold;line-height:1">' + fmt(t1) + '</div>';
      html += '<div style="font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.5px;margin-top:8px">TOTAL ACUMULADO</div>';
      html += '</div>';
      html += '</div>';

      html += '<div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:12px">';
      html += '<div style="color:' + (p >= 0 ? '#00E396' : '#FF4560') + '">↑ ' + p.toFixed(1) + '% vs Mes Anterior</div>';
      html += '<div style="color:rgba(255,255,255,0.4)">Mes anterior: ' + fmt(t2) + '</div>';
      html += '</div>';

      const w = 1000, ht = 300, ml = 60, mr = 40, mt = 30, mb = 50;
      const iw = w - ml - mr, ih = ht - mt - mb;
      const max = Math.max(t1, t2) * 1.05 || 1000;
      const sy = ih / max, sx = iw / 30;

      html += '<svg width="100%" height="' + ht + '" viewBox="0 0 ' + w + ' ' + ht + '" preserveAspectRatio="xMidYMid meet">';

      let p2 = "M " + ml + " " + (mt + ih);
      for(let i = 0; i < 31; i++) {
        const x = ml + i * sx;
        const y = mt + ih - (d2[i] || 0) * sy;
        p2 += " L " + x + " " + y;
      }
      html += '<path d="' + p2 + '" stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none" stroke-dasharray="5,5"/>';

      let p1 = "M " + ml + " " + (mt + ih);
      for(let i = 0; i < 31; i++) {
        const x = ml + i * sx;
        const y = mt + ih - (d1[i] || 0) * sy;
        p1 += " L " + x + " " + y;
      }
      html += '<path d="' + p1 + '" stroke="#00E396" stroke-width="3" fill="none"/>';

      const area = p1 + " L " + (ml + 30*sx) + " " + (mt + ih) + " L " + ml + " " + (mt + ih) + " Z";
      html += '<path d="' + area + '" fill="rgba(0,227,150,0.15)"/>';

      html += '<line x1="' + ml + '" y1="' + (mt + ih) + '" x2="' + w + '" y2="' + (mt + ih) + '" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>';

      for(let i = 0; i <= 30; i += 5) {
        const x = ml + i * sx;
        html += '<text x="' + x + '" y="' + (mt + ih + 25) + '" fill="rgba(255,255,255,0.4)" font-size="10" text-anchor="middle">' + (i+1) + '</text>';
      }

      html += '<g><line x1="' + (ml + 20) + '" y1="15" x2="' + (ml + 32) + '" y2="15" stroke="#00E396" stroke-width="2"/>';
      html += '<text x="' + (ml + 40) + '" y="19" fill="rgba(255,255,255,0.7)" font-size="11">Mes Actual</text>';
      html += '<line x1="' + (ml + 180) + '" y1="15" x2="' + (ml + 192) + '" y2="15" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>';
      html += '<text x="' + (ml + 200) + '" y="19" fill="rgba(255,255,255,0.7)" font-size="11">Mes Anterior</text></g>';

      html += '</svg>';
      html += '</div>';

      c.innerHTML = html;
    }

    function renderMonthDropdown() {
      const dropdown = document.getElementById('month-dropdown');
      if(!dropdown) return;

      dropdown.innerHTML = '';
      const months = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

      months.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'month-option';
        div.textContent = m + ' 2026';
        div.onclick = () => {
          document.getElementById('month-dropdown').classList.remove('active');
        };
        dropdown.appendChild(div);
      });

      const sep = document.createElement('div');
      sep.className = 'month-separator';
      dropdown.appendChild(sep);

      const lbl = document.createElement('div');
      lbl.className = 'month-label';
      lbl.textContent = 'RANGO DE DÍAS';
      dropdown.appendChild(lbl);

      [7, 15, 30, 60, 90].forEach(days => {
        const div = document.createElement('div');
        div.className = 'month-option';
        div.textContent = days + ' días';
        div.onclick = () => {
          document.getElementById('month-dropdown').classList.remove('active');
        };
        dropdown.appendChild(div);
      });
    }

    document.getElementById('month-selector-btn').addEventListener('click', () => {
      document.getElementById('month-dropdown').classList.toggle('active');
    });

    document.addEventListener('DOMContentLoaded', () => {
      loadDashboard();
    });
  </script>
</body>
</html>
